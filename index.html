<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上饶师院 牛逼炸了！！！</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&family=Bangers&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(45deg, #ff0080, #ff4080, #ff00ff, #00ffff, #00ff80, #ffff00);
            background-size: 400% 400%;
            animation: gradientShift 3s ease infinite;
            overflow-x: hidden;
            font-family: 'ZCOOL KuaiLe', 'Ma Shan Zheng', cursive;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        /* 爆炸式主标题 */
        .main-title {
            font-size: clamp(60px, 15vw, 200px);
            font-family: 'Ma Shan Zheng', cursive;
            text-align: center;
            color: #fff;
            text-shadow: 
                0 0 10px #fff,
                0 0 20px #fff,
                0 0 30px #fff,
                0 0 40px #ff0080,
                0 0 70px #ff0080,
                0 0 80px #ff0080,
                0 0 100px #ff0080,
                0 0 150px #ff0080,
                5px 5px 0 #000,
                -5px -5px 0 #000;
            animation: explode 0.5s ease-in-out infinite alternate, pulse 1s ease-in-out infinite;
            position: relative;
            z-index: 10;
            letter-spacing: 10px;
        }
        
        @keyframes explode {
            0% { transform: scale(1) rotate(-2deg); }
            100% { transform: scale(1.1) rotate(2deg); }
        }
        
        @keyframes pulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.5); }
        }
        
        /* 副标题 */
        .subtitle {
            font-size: clamp(30px, 8vw, 80px);
            font-family: 'Bangers', cursive;
            color: #ffff00;
            text-shadow: 
                3px 3px 0 #ff0080,
                6px 6px 0 #00ffff,
                0 0 30px #ffff00;
            margin-top: 30px;
            animation: bounce 0.6s ease-in-out infinite;
            letter-spacing: 5px;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }
        
        /* 彩带效果 */
        .confetti {
            position: fixed;
            width: 15px;
            height: 15px;
            top: -20px;
            animation: fall linear infinite;
            z-index: 1;
        }
        
        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        /* 星星背景 */
        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .star {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 1s ease-in-out infinite;
            box-shadow: 0 0 10px #fff, 0 0 20px #ffff00;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }
        
        /* 爆炸粒子 */
        .particle {
            position: fixed;
            font-size: 30px;
            animation: explodeParticle 2s ease-out forwards;
            z-index: 100;
            pointer-events: none;
        }
        
        @keyframes explodeParticle {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }
        
        /* 超级牛逼按钮 */
        .super-button {
            margin-top: 50px;
            padding: 25px 80px;
            font-size: 40px;
            font-family: 'Bangers', cursive;
            background: linear-gradient(45deg, #ff0080, #ff00ff, #00ffff, #ff0080);
            background-size: 300% 300%;
            animation: buttonGradient 2s ease infinite;
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            box-shadow: 
                0 10px 30px rgba(255,0,128,0.5),
                0 0 50px rgba(255,0,255,0.5);
            transition: all 0.3s;
            letter-spacing: 5px;
            position: relative;
            z-index: 10;
        }
        
        .super-button:hover {
            transform: scale(1.2) rotate(5deg);
            box-shadow: 
                0 15px 50px rgba(255,0,128,0.8),
                0 0 100px rgba(255,0,255,0.8);
        }
        
        @keyframes buttonGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* 文字滚动 */
        .marquee {
            position: fixed;
            bottom: 50px;
            width: 100%;
            overflow: hidden;
            z-index: 10;
        }
        
        .marquee-content {
            display: flex;
            animation: marquee 10s linear infinite;
            white-space: nowrap;
        }
        
        .marquee-text {
            font-size: 30px;
            color: #fff;
            text-shadow: 0 0 20px #ff0080;
            padding: 0 50px;
            font-family: 'ZCOOL KuaiLe', cursive;
        }
        
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        
        /* 震动效果 */
        .shake {
            animation: shake 0.5s ease-in-out infinite;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-1deg); }
            75% { transform: translateX(10px) rotate(1deg); }
        }
        
        /* 彩虹边框 */
        .rainbow-border {
            position: relative;
            padding: 30px 50px;
            border: 5px solid transparent;
            background: linear-gradient(#000, #000) padding-box,
                        linear-gradient(45deg, red, orange, yellow, green, blue, purple, red) border-box;
            background-size: 200% 200%;
            animation: rainbowBorder 3s linear infinite;
            border-radius: 20px;
        }
        
        @keyframes rainbowBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* 火焰效果 */
        .fire {
            position: relative;
            animation: fireGlow 0.5s ease-in-out infinite alternate;
        }
        
        @keyframes fireGlow {
            0% { text-shadow: 0 0 20px #ff0000, 0 0 40px #ff4400, 0 0 60px #ff8800; }
            100% { text-shadow: 0 0 30px #ff0000, 0 0 60px #ff4400, 0 0 90px #ff8800, 0 0 120px #ffff00; }
        }
        
        /* 闪电效果 */
        .lightning {
            animation: lightning 0.1s infinite;
        }
        
        @keyframes lightning {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* 文字特效容器 */
        .effects-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            pointer-events: none;
        }
        
        /* 礼花效果 */
        .firework {
            position: fixed;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            animation: fireworkExplode 1s ease-out forwards;
        }
        
        @keyframes fireworkExplode {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }
        
        /* 打字机效果 */
        .typewriter {
            font-size: 25px;
            color: #fff;
            overflow: hidden;
            white-space: nowrap;
            animation: typing 3s steps(30, end), blink 0.75s step-end infinite;
            border-right: 3px solid #fff;
        }
        
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        
        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: #fff; }
        }
        
        /* 旋转文字 */
        .rotating-text {
            font-size: 50px;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            animation: rotateText 5s linear infinite;
            margin-top: 30px;
        }
        
        @keyframes rotateText {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 弹跳球 */
        .bouncing-ball {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff0080, #ff00ff);
            position: fixed;
            animation: bounceBall 2s ease-in-out infinite;
            box-shadow: 0 0 30px #ff0080;
        }
        
        @keyframes bounceBall {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-200px) scale(1.2); }
        }
        
        /* 彩虹文字 */
        .rainbow-text {
            background: linear-gradient(45deg, 
                #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbowText 3s ease infinite;
        }
        
        @keyframes rainbowText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* 爆炸背景 */
        .explosion-bg {
            position: fixed;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,0,128,0.8) 0%, transparent 70%);
            border-radius: 50%;
            animation: explosionBg 2s ease-out infinite;
            pointer-events: none;
        }
        
        @keyframes explosionBg {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }
        
        /* 多行夸张文字 */
        .extra-text {
            margin-top: 40px;
            font-size: clamp(25px, 5vw, 50px);
            color: #fff;
            text-align: center;
            text-shadow: 0 0 20px #ff0080;
            line-height: 1.8;
            position: relative;
            z-index: 10;
        }
        
        .extra-text span {
            display: inline-block;
            animation: popIn 0.5s ease-out backwards;
        }
        
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* 底部大标语 */
        .footer-banner {
            font-size: clamp(40px, 10vw, 120px);
            font-family: 'Bangers', cursive;
            position: fixed;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            writing-mode: vertical-rl;
            text-orientation: upright;
            color: #ffff00;
            text-shadow: 
                3px 3px 0 #ff0080,
                -3px -3px 0 #00ffff,
                0 0 30px #ffff00;
            animation: footerBounce 1s ease-in-out infinite;
            letter-spacing: 10px;
            z-index: 10;
        }
        
        @keyframes footerBounce {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
        }
        
        /* 特效文字 */
        .special-effect {
            font-size: 35px;
            margin: 20px 0;
            position: relative;
            z-index: 10;
        }
        
        .neon {
            color: #fff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #fff,
                0 0 40px #ff0080,
                0 0 80px #ff0080;
            animation: neon 1.5s ease-in-out infinite alternate;
        }
        
        @keyframes neon {
            0% { text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #fff,
                0 0 40px #ff0080,
                0 0 80px #ff0080; }
            100% { text-shadow: 
                0 0 10px #fff,
                0 0 20px #fff,
                0 0 30px #fff,
                0 0 50px #ff0080,
                0 0 100px #ff0080,
                0 0 150px #ff00ff; }
        }
        
        /* 3D效果 */
        .threedee {
            font-size: 40px;
            color: #fff;
            text-shadow: 
                1px 1px 0 #ff0080,
                2px 2px 0 #ff0080,
                3px 3px 0 #ff0080,
                4px 4px 0 #ff0080,
                5px 5px 0 #ff0080,
                6px 6px 10px rgba(0,0,0,0.5);
            transform: perspective(500px) rotateX(10deg);
            animation: threedee 2s ease-in-out infinite;
            position: relative;
            z-index: 10;
        }
        
        @keyframes threedee {
            0%, 100% { transform: perspective(500px) rotateX(10deg) rotateY(0deg); }
            50% { transform: perspective(500px) rotateX(10deg) rotateY(30deg); }
        }
        
        /* 闪烁文字 */
        .flash {
            animation: flash 0.5s linear infinite;
        }
        
        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="container">
        <div class="rainbow-border">
            <h1 class="main-title fire lightning shake">上饶师院</h1>
        </div>
        <h2 class="subtitle rainbow-text">牛 逼 炸 了 ！ ！ ！</h2>
        
        <div class="extra-text" id="extraText"></div>
        
        <button class="super-button" onclick="explodeAll()">点我爆炸！！！</button>
        
        <div class="rotating-text">★★★★★</div>
        
        <div class="threedee">宇宙第一高校！！！</div>
        
        <div class="neon special-effect">地表最强 · 无人能敌</div>
    </div>
    
    <div class="footer-banner">上饶师院 NO.1 FOREVER</div>
    
    <div class="marquee">
        <div class="marquee-content">
            <span class="marquee-text">🎉 上饶师院最牛逼！🎉</span>
            <span class="marquee-text">🔥 全国第一高校！🔥</span>
            <span class="marquee-text">💖 我爱饶师院！💖</span>
            <span class="marquee-text">🚀 最强！最强！最强！🚀</span>
            <span class="marquee-text">🏆 世界顶尖大学！🏆</span>
            <span class="marquee-text">⚡ 牛逼到爆炸！⚡</span>
            <span class="marquee-text">🎊 上饶师院万岁！🎊</span>
            <span class="marquee-text">🌟 宇宙第一！🌟</span>
            <span class="marquee-text">🎉 上饶师院最牛逼！🎉</span>
            <span class="marquee-text">🔥 全国第一高校！🔥</span>
            <span class="marquee-text">💖 我爱饶师院！💖</span>
            <span class="marquee-text">🚀 最强！最强！最强！🚀</span>
            <span class="marquee-text">🏆 世界顶尖大学！🏆</span>
            <span class="marquee-text">⚡ 牛逼到爆炸！⚡</span>
            <span class="marquee-text">🎊 上饶师院万岁！🎊</span>
            <span class="marquee-text">🌟 宇宙第一！🌟</span>
        </div>
    </div>
    
    <div class="effects-container" id="effectsContainer"></div>
    
    <script>
        // 创建星星背景
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.animationDuration = (Math.random() * 2 + 0.5) + 's';
                starsContainer.appendChild(star);
            }
        }
        
        // 创建彩带
        function createConfetti() {
            const colors = ['#ff0080', '#ff00ff', '#00ffff', '#ffff00', '#00ff80', '#ff4080'];
            const emojis = ['🎉', '🎊', '✨', '💖', '🔥', '⚡', '🏆', '🌟', '💯', '🎈', '🥳', '💪'];
            
            setInterval(() => {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                confetti.style.fontSize = '20px';
                confetti.style.background = 'transparent';
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 5000);
            }, 100);
        }
        
        // 爆炸粒子效果
        function createParticle(x, y) {
            const emojis = ['💥', '🎆', '✨', '🔥', '⚡', '💫', '🌟', '💖', '🎉', '🏆'];
            for (let i = 0; i < 10; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const angle = (Math.PI * 2 / 10) * i;
                const distance = Math.random() * 200 + 100;
                particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 2000);
            }
        }
        
        // 创建礼花
        function createFirework(x, y) {
            const colors = ['#ff0080', '#ff00ff', '#00ffff', '#ffff00', '#00ff80', '#ff4080', '#ffffff'];
            const particles = 30;
            
            for (let i = 0; i < particles; i++) {
                const firework = document.createElement('div');
                firework.className = 'firework';
                firework.style.left = x + 'px';
                firework.style.top = y + 'px';
                firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                firework.style.boxShadow = `0 0 10px ${colors[Math.floor(Math.random() * colors.length)]}`;
                
                const angle = (Math.PI * 2 / particles) * i;
                const velocity = Math.random() * 100 + 50;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                firework.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 1000,
                    easing: 'ease-out'
                });
                
                document.body.appendChild(firework);
                setTimeout(() => firework.remove(), 1000);
            }
        }
        
        // 爆炸所有效果
        function explodeAll() {
            // 多个礼花
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    createFirework(
                        Math.random() * window.innerWidth,
                        Math.random() * window.innerHeight * 0.5
                    );
                }, i * 100);
            }
            
            // 多个粒子
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    createParticle(
                        Math.random() * window.innerWidth,
                        Math.random() * window.innerHeight
                    );
                }, i * 50);
            }
            
            // 震动屏幕
            document.body.classList.add('shake');
            setTimeout(() => document.body.classList.remove('shake'), 1000);
            
            // 创建爆炸背景
            for (let i = 0; i < 5; i++) {
                const explosion = document.createElement('div');
                explosion.className = 'explosion-bg';
                explosion.style.left = Math.random() * 80 + 10 + '%';
                explosion.style.top = Math.random() * 80 + 10 + '%';
                document.body.appendChild(explosion);
                setTimeout(() => explosion.remove(), 2000);
            }
        }
        
        // 额外文字动画
        function createExtraText() {
            const texts = [
                '🌟 中国最好大学！🌟',
                '🚀 培养精英的摇篮！🚀',
                '💪 学霸云集的地方！💪',
                '🏆 成就梦想的殿堂！🏆',
                '🎓 知识改变命运！🎓',
                '🔥 前途无量！🔥',
                '💖 人间天堂！💖',
                '⚡ 超级无敌！⚡'
            ];
            
            const container = document.getElementById('extraText');
            let index = 0;
            
            setInterval(() => {
                const span = document.createElement('span');
                span.className = 'rainbow-text';
                span.textContent = texts[index % texts.length];
                span.style.animationDelay = (index * 0.1) + 's';
                container.innerHTML = '';
                container.appendChild(span);
                index++;
            }, 1500);
        }
        
        // 鼠标移动粒子效果
        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.9) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.textContent = ['✨', '💫', '⭐', '🌟'][Math.floor(Math.random() * 4)];
                particle.style.left = e.clientX + 'px';
                particle.style.top = e.clientY + 'px';
                particle.style.setProperty('--tx', (Math.random() - 0.5) * 100 + 'px');
                particle.style.setProperty('--ty', (Math.random() - 0.5) * 100 + 'px');
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 2000);
            }
        });
        
        // 随机礼花
        setInterval(() => {
            if (Math.random() > 0.7) {
                createFirework(
                    Math.random() * window.innerWidth,
                    Math.random() * window.innerHeight * 0.3
                );
            }
        }, 2000);
        
        // 初始化
        createStars();
        createConfetti();
        createExtraText();
        
        // 页面加载时礼花
        window.onload = () => {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createFirework(
                        Math.random() * window.innerWidth,
                        Math.random() * window.innerHeight * 0.5
                    );
                }, i * 200);
            }
        };
    </script>
</body>
</html>
